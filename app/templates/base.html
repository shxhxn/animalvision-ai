<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AnimalVision AI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="{{ url_for('main.index') }}" class="brand">
                <span class="brand-icon">🐾</span> AnimalVision AI
            </a>
            <div class="nav-links">
                <a href="{{ url_for('main.index') }}" class="{{ 'active' if request.endpoint == 'main.index' }}">Predict</a>
                <a href="{{ url_for('main.history') }}" class="{{ 'active' if request.endpoint == 'main.history' }}">History</a>
                <a href="{{ url_for('main.metrics') }}" class="{{ 'active' if request.endpoint == 'main.metrics' }}">Model Performance</a>
                <a href="{{ url_for('main.about') }}" class="{{ 'active' if request.endpoint == 'main.about' }}">About</a>
            </div>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
                <span id="theme-icon">🌙</span>
            </button>
        </div>
    </nav>

    <main class="page-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>AnimalVision AI &mdash; a CNN trained from scratch, served with Flask.
            <a href="https://github.com" target="_blank" rel="noopener">View on GitHub</a>
        </p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
